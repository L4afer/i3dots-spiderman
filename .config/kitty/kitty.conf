# ===============================
# Kitty Terminal - Clean Config
# ===============================

# Font settings
font_family Departure Mono Nerd Font
bold_font auto
italic_font auto
font_size 12.0

# Cursor settings
cursor_trail 1
cursor_trail_length 4
cursor_trail_fade_steps 4

# ANSI colors
color0                #0B0E1A
color1                #aa3b3f
color2                #544c9f
color3                #F4C542
color4                #1E3A8A
color5                #7B2D8E
color6                #3AB4E0
color7                #C7CCD9
color8                #1C2233
color9                #FF3B3F
color10               #6FCB92
color11               #FFD966
color12               #2F6FED
color13               #A15FC4
color14               #5FD0F3
color15               #F5F6FA

background            #0B0E1A
foreground            #F5F6FA
cursor                #924245
# Transparency
background_opacity 0.75

# Padding
window_padding_width 10

# Scrolling
scrollback_lines 10000

# Window decorations
confirm_os_window_close 0

# Automatically run neofetch
#shell /usr/bin/env zsh -c 'neofetch; exec zsh'
shell /usr/bin/env zsh -c 'exec zsh'

enable_audible_bell no

